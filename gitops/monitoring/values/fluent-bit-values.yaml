---
resources:
  requests:
    memory: "24Mi"
    cpu: "15m"
  limits:
    memory: "48Mi"
    cpu: "75m"
livenessProbe:
  httpGet:
    path: "/"
    port: "http"
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: "/api/v2/health"
    port: "http"
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
config:
  inputs: "[INPUT]\n    Name              tail\n    Tag               kube.*\n   \
    \ Path              /var/log/containers/*.log\n    Parser            cri\n   \
    \ Mem_Buf_Limit     5MB\n    Skip_Long_Lines   On\n    Refresh_Interval  10\n"
  filters: "[FILTER]\n    Name                kubernetes\n    Match              \
    \ kube.*\n    Merge_Log           On\n    Keep_Log            Off\n    K8S-Logging.Parser\
    \  On\n    K8S-Logging.Exclude On\n\n[FILTER]\n    Name                nest\n\
    \    Match               kube.*\n    Operation           lift\n    Nested_under\
    \        log\n    Add_prefix          log_\n\n[FILTER]\n    Name             \
    \   modify\n    Match               kube.*\n    Rename              log_level\
    \ level\n    Rename              log_service service\n"
  outputs: "[OUTPUT]\n    Name                 loki\n    Match                kube.*\n\
    \    Host                 loki.monitoring.svc.cluster.local\n    Port        \
    \         3100\n    Labels               job=fluent-bit, namespace=$kubernetes['namespace_name'],\
    \ pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], service=$service,\
    \ level=$level\n    line_format          json\n    label_keys           $level,$service\n\
    \    remove_keys          kubernetes,stream\n    Auto_Kubernetes_Labels Off\n"
