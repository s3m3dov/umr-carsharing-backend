---
resources:
  requests:
    memory: "48Mi"
    cpu: "25m"
  limits:
    memory: "128Mi"
    cpu: "150m"
livenessProbe:
  httpGet:
    path: "/"
    port: "http"
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: "/api/v2/health"
    port: "http"
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
config:
  service: |
    [SERVICE]
        Daemon          Off
        Flush           1
        Log_Level       info
        Parsers_File    parsers.conf
        Parsers_File    custom_parsers.conf
        HTTP_Server     On
        HTTP_Listen     0.0.0.0
        HTTP_Port       2020
        Health_Check    On

  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Parser              cri
        Mem_Buf_Limit       10MB
        Skip_Long_Lines     On
        Refresh_Interval    10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Trim      On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off
        Buffer_Size         32k

    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             $kubernetes['namespace_name'] ^(kube-system|kube-public|kube-node-lease|gke-managed-system|gke-gmp-system|gmp-system|gmp-public)$

    [FILTER]
        Name                modify
        Match               kube.*
        Remove              @version
        Remove              HOSTNAME
        Remove              levelValue
        Remove              logger_name
        Rename              thread_name thread

  outputs: |
    [OUTPUT]
        Name                    loki
        Match                   kube.*
        Host                    loki.monitoring.svc.cluster.local
        Port                    3100
        Labels                  job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], app=$kubernetes['labels']['app'], level=$level
        Auto_Kubernetes_Labels  Off
        line_format             json
        remove_keys             kubernetes,stream,logtag,_p,time
        drop_single_key         Off
