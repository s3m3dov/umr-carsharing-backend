# Prometheus ServiceMonitor — scrapes /actuator/prometheus on all carsharing services.
# Requires kube-prometheus-stack (or the prometheus-operator CRD) to be installed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: carsharing-services
  namespace: monitoring
  labels:
    # Must match prometheus-stack's serviceMonitorSelector (or use nil selector in values)
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: carsharing
  namespaceSelector:
    matchNames:
      - carsharing
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
