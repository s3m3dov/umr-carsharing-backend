---
apiVersion: "monitoring.coreos.com/v1"
kind: "ServiceMonitor"
metadata:
  name: "carsharing-services"
  namespace: "monitoring"
  labels:
    release: "kube-prometheus-stack"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "carsharing"
  namespaceSelector:
    matchNames:
    - "carsharing"
  endpoints:
  - port: "http"
    path: "/actuator/prometheus"
    interval: "30s"
    scrapeTimeout: "10s"
