---
apiVersion: "kustomize.config.k8s.io/v1beta1"
kind: "Kustomization"
namespace: "carsharing"
resources:
- "../../base"
- "ingress-production.yaml"
- "backend-config.yaml"
images:
- name: "eu.gcr.io/project-id/api-gateway"
  newName: "eu.gcr.io/project-08acfdb6-8102-494d-8ee/api-gateway"
  newTag: "latest"
- name: "eu.gcr.io/project-id/auth-service"
  newName: "eu.gcr.io/project-08acfdb6-8102-494d-8ee/auth-service"
  newTag: "latest"
- name: "eu.gcr.io/project-id/user-service"
  newName: "eu.gcr.io/project-08acfdb6-8102-494d-8ee/user-service"
  newTag: "latest"
- name: "eu.gcr.io/project-id/trip-service"
  newName: "eu.gcr.io/project-08acfdb6-8102-494d-8ee/trip-service"
  newTag: "latest"
- name: "eu.gcr.io/project-id/review-service"
  newName: "eu.gcr.io/project-08acfdb6-8102-494d-8ee/review-service"
  newTag: "latest"
- name: "eu.gcr.io/project-id/notification-service"
  newName: "eu.gcr.io/project-08acfdb6-8102-494d-8ee/notification-service"
  newTag: "latest"
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 1"
  target:
    kind: "Deployment"
- patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1"
  target:
    kind: "HorizontalPodAutoscaler"
- patch: "- op: add\n  path: /metadata/annotations\n  value:\n    cloud.google.com/neg:\
    \ '{\"ingress\": true}'"
  target:
    kind: "Service"
    name: "api-gateway"
- patch: "- op: add\n  path: /metadata/annotations/cloud.google.com~1backend-config\n\
    \  value: '{\"ports\": {\"80\": \"carsharing-backend-config\"}}'"
  target:
    kind: "Service"
    name: "api-gateway"
- patch: "- op: replace\n  path: /spec/ports/0/port\n  value: 80\n- op: replace\n\
    \  path: /spec/ports/0/targetPort\n  value: 8080"
  target:
    kind: "Service"
    name: "api-gateway"
