---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "carsharing-ingress"
  namespace: "carsharing"
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "carsharing-ip"
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: "api-gateway"
      port:
        number: 80
