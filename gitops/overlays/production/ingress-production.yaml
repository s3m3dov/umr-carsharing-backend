apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carsharing-ingress
  namespace: carsharing
  annotations:
    kubernetes.io/ingress.allow-http: "true"
spec:
  ingressClassName: gce
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
