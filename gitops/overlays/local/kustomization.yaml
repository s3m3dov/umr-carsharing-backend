---
apiVersion: "kustomize.config.k8s.io/v1beta1"
kind: "Kustomization"
namespace: "carsharing"
resources:
- "../../base"
- "ingress-local.yaml"
images:
- name: "eu.gcr.io/project-id/api-gateway"
  newName: "api-gateway"
  newTag: "local"
- name: "eu.gcr.io/project-id/auth-service"
  newName: "auth-service"
  newTag: "local"
- name: "eu.gcr.io/project-id/user-service"
  newName: "user-service"
  newTag: "local"
- name: "eu.gcr.io/project-id/trip-service"
  newName: "trip-service"
  newTag: "local"
- name: "eu.gcr.io/project-id/review-service"
  newName: "review-service"
  newTag: "local"
- name: "eu.gcr.io/project-id/notification-service"
  newName: "notification-service"
  newTag: "local"
patches:
- patch: "- op: add\n  path: /spec/template/spec/containers/0/imagePullPolicy\n  value:\
    \ IfNotPresent\n- op: replace\n  path: /spec/strategy\n  value:\n    type: Recreate"
  target:
    kind: "Deployment"
