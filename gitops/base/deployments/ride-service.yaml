apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  namespace: carsharing
  labels:
    app: ride-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ride-service
  template:
    metadata:
      labels:
        app: ride-service
    spec:
      serviceAccountName: spring-cloud
      containers:
        - name: ride-service
          image: eu.gcr.io/project-id/ride-service:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: carsharing-secrets
                  key: MONGODB_URI
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ride-service
  namespace: carsharing
  labels:
    app: ride-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: ride-service
