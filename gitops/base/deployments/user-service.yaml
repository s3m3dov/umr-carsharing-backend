---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "user-service"
  namespace: "carsharing"
  labels:
    app: "user-service"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "user-service"
  template:
    metadata:
      labels:
        app: "user-service"
    spec:
      serviceAccountName: "spring-cloud"
      containers:
      - name: "user-service"
        image: "eu.gcr.io/project-id/user-service:latest"
        ports:
        - containerPort: 8080
          name: "http"
        env:
        - name: "MONGODB_URI"
          valueFrom:
            secretKeyRef:
              name: "carsharing-secrets"
              key: "MONGODB_URI"
        - name: "SPRING_PROFILES_ACTIVE"
          value: "kubernetes"
        - name: "JAVA_TOOL_OPTIONS"
          value: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError"
        resources:
          requests:
            memory: "192Mi"
            cpu: "75m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: "/actuator/health/liveness"
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: "/actuator/health/liveness"
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: "/actuator/health/readiness"
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "user-service"
  namespace: "carsharing"
  labels:
    app: "user-service"
spec:
  type: "ClusterIP"
  ports:
  - port: 8080
    targetPort: 8080
    protocol: "TCP"
    name: "http"
  selector:
    app: "user-service"
