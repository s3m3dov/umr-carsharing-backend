spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${PORT:8087}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}
    non-secure-port-enabled: true
    secure-port-enabled: false
    non-secure-port: ${PORT:8087}
    statusPageUrl: http://${eureka.instance.hostname}/actuator/info
    healthCheckUrl: http://${eureka.instance.hostname}/actuator/health
    homePageUrl: http://${eureka.instance.hostname}/

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}