server:
  forward-headers-strategy: framework
spring:
  application:
    name: auth-service
  main:
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    loadbalancer:
      retry:
        enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
auth:
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/signup
      - /api/auth/validate
      - /api/auth/reset-password
      - /api/auth/reset-password/confirm
    docs-paths:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**
    actuator-paths:
      - /actuator/health/**
      - /actuator/info/**

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  server:
    url: /auth-service

jwt:
  secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  user:
    base-url: http://user-service:8080