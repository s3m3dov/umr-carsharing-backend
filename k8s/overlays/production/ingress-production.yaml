apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carsharing-ingress
  namespace: carsharing
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "carsharing-ip"
    networking.gke.io/managed-certificates: "carsharing-cert"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: carsharing-cert
  namespace: carsharing
spec:
  domains:
    - your-domain.com  # Replace with your actual domain
