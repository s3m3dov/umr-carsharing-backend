name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      image_tag:
        description: 'Image tag to deploy (e.g., main-abc123 or latest)'
        required: true
        default: 'latest'
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: true
        default: 'all'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  REGISTRY: gcr.io

jobs:
  manual-deploy:
    name: Manual Deployment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Install gke-gcloud-auth-plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin
    
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
          --zone=${{ env.GKE_ZONE }} \
          --project=${{ env.GCP_PROJECT_ID }}
    
    - name: Parse services to deploy
      id: parse_services
      run: |
        SERVICES="${{ github.event.inputs.services }}"
        if [ "$SERVICES" == "all" ]; then
          SERVICES="auth-service,user-service,vehicle-service,trip-service,ride-service,notification-service,api-gateway"
        fi
        echo "services=$SERVICES" >> $GITHUB_OUTPUT
        echo "Deploying services: $SERVICES"
    
    - name: Update image tags
      run: |
        cd k8s
        IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        
        # Update each service image
        IFS=',' read -ra SERVICE_ARRAY <<< "${{ steps.parse_services.outputs.services }}"
        for service in "${SERVICE_ARRAY[@]}"; do
          service=$(echo $service | xargs)  # trim whitespace
          echo "Updating $service to tag $IMAGE_TAG"
          kustomize edit set image \
            gcr.io/${{ env.GCP_PROJECT_ID }}/$service=gcr.io/${{ env.GCP_PROJECT_ID }}/$service:$IMAGE_TAG
        done
    
    - name: Deploy selected services
      run: |
        IFS=',' read -ra SERVICE_ARRAY <<< "${{ steps.parse_services.outputs.services }}"
        for service in "${SERVICE_ARRAY[@]}"; do
          service=$(echo $service | xargs)
          echo "Deploying $service..."
          kubectl set image deployment/$service \
            $service=gcr.io/${{ env.GCP_PROJECT_ID }}/$service:${{ github.event.inputs.image_tag }} \
            -n carsharing
        done
    
    - name: Wait for rollout
      run: |
        IFS=',' read -ra SERVICE_ARRAY <<< "${{ steps.parse_services.outputs.services }}"
        for service in "${SERVICE_ARRAY[@]}"; do
          service=$(echo $service | xargs)
          echo "Waiting for $service rollout..."
          kubectl rollout status deployment/$service -n carsharing --timeout=5m
        done
    
    - name: Verify deployment
      run: |
        echo "=== Pods ==="
        kubectl get pods -n carsharing
        echo ""
        echo "=== Services ==="
        kubectl get services -n carsharing
        echo ""
        echo "=== Deployments ==="
        kubectl get deployments -n carsharing
    
    - name: Deployment Summary
      if: always()
      run: |
        echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "**Image Tag:** ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
        echo "**Services:** ${{ steps.parse_services.outputs.services }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
