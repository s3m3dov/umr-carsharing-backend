server:
  forward-headers-strategy: framework

spring:
  application:
    name: review-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mongodb}
  main:
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    loadbalancer:
      retry:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/carsharing}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carsharing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  server:
    url: /review-service
