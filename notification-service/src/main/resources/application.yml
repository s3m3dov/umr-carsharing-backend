server:
  forward-headers-strategy: framework
spring:
  application:
    name: notification-service
  main:
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    loadbalancer:
      retry:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://tempo.monitoring.svc.cluster.local:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  server:
    url: /notification-service

firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:/etc/secrets/firebase.json}
  database:
    url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}