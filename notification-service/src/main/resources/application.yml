server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:/etc/secrets/firebase.json}
  database:
    url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}