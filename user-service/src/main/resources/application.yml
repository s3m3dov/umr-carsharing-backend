spring:
  application:
    name: user-service
  main:
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    loadbalancer:
      retry:
        enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html