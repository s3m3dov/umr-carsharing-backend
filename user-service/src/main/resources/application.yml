server:
  port: ${PORT:8081}

spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://singhv:NotANewPasswordForMongo@cluster0.akdsgeh.mongodb.net/carsharingDB?retryWrites=true&w=majority&appName=Cluster0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}
    non-secure-port-enabled: true
    secure-port-enabled: false
    non-secure-port: ${PORT:8081}
    statusPageUrl: http://${eureka.instance.hostname}/actuator/info
    healthCheckUrl: http://${eureka.instance.hostname}/actuator/health
    homePageUrl: http://${eureka.instance.hostname}/

management:
  endpoints:
    web:
      exposure:
        include: health,info