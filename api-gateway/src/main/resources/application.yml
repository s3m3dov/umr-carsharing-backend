spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/user-service/**
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/auth-service/**
        - id: vehicle-service
          uri: http://vehicle-service:8080
          predicates:
            - Path=/vehicle-service/**
        - id: trip-service
          uri: http://trip-service:8080
          predicates:
            - Path=/trip-service/**
        - id: ride-service
          uri: http://ride-service:8080
          predicates:
            - Path=/ride-service/**
        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/notification-service/**
    loadbalancer:
      retry:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
    urls:
      - name: user
        url: /user-service/v3/api-docs
      - name: auth
        url: /auth-service/v3/api-docs
      - name: vehicle
        url: /vehicle-service/v3/api-docs
      - name: trip
        url: /trip-service/v3/api-docs
      - name: ride
        url: /ride-service/v3/api-docs
      - name: notification
        url: /notification-service/v3/api-docs