spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1
        - id: vehicle-service
          uri: http://vehicle-service:8080
          predicates:
            - Path=/vehicle-service/**
          filters:
            - StripPrefix=1
        - id: trip-service
          uri: http://trip-service:8080
          predicates:
            - Path=/trip-service/**
          filters:
            - StripPrefix=1
        - id: ride-service
          uri: http://ride-service:8080
          predicates:
            - Path=/ride-service/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1
    loadbalancer:
      retry:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
    urls:
      - name: user
        url: /user-service/v3/api-docs
      - name: auth
        url: /auth-service/v3/api-docs
      - name: vehicle
        url: /vehicle-service/v3/api-docs
      - name: trip
        url: /trip-service/v3/api-docs
      - name: ride
        url: /ride-service/v3/api-docs
      - name: notification
        url: /notification-service/v3/api-docs

gateway:
  security:
    public-paths:
      - /auth-service/api/auth/login
      - /auth-service/api/auth/signup
      - /auth-service/api/auth/validate
      - /health
      - /webjars
    docs-paths:
      - /v3/api-docs
      - /swagger-ui
      - /swagger-ui.html
    actuator-paths:
      - /actuator/health
      - /actuator/info
  services:
    auth:
      base-url: http://auth-service:8080
      validate-path: /api/auth/validate