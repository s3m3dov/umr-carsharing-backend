spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
    loadbalancer:
      retry:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    use-root-path: true
    # We will use dynamic aggregation in OpenApiConfig.java