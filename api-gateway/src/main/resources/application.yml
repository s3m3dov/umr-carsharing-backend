server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # OpenAPI documentation routes - these must come BEFORE the service routes
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
        - id: vehicle-service-docs
          uri: lb://vehicle-service
          predicates:
            - Path=/v3/api-docs/vehicle
          filters:
            - RewritePath=/v3/api-docs/vehicle, /v3/api-docs
        - id: trip-service-docs
          uri: lb://trip-service
          predicates:
            - Path=/v3/api-docs/trip
          filters:
            - RewritePath=/v3/api-docs/trip, /v3/api-docs
        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification
          filters:
            - RewritePath=/v3/api-docs/notification, /v3/api-docs
        - id: ride-service-docs
          uri: lb://ride-service
          predicates:
            - Path=/v3/api-docs/ride
          filters:
            - RewritePath=/v3/api-docs/ride, /v3/api-docs
        
        # Service API routes
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0
        - id: vehicle-service
          uri: lb://vehicle-service
          predicates:
            - Path=/api/vehicles/**
          filters:
            - StripPrefix=0
        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/api/ride/**,/api/myrides/**,/api/trips/**,/api/rides/**
          filters:
            - StripPrefix=0
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - https://tanzania-car-sharing.netlify.app
              - http://localhost:3000
              - https://localhost:3000
              - http://localhost:8080 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # We will use dynamic aggregation in OpenApiConfig.java