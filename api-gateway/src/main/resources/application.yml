spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    loadbalancer:
      retry:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # We will use dynamic aggregation in OpenApiConfig.java