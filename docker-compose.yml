networks:
  carsharing-network:
    driver: bridge

services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
    networks:
      - carsharing-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8089:8089"
    environment:
      PORT: 8089
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-secret-key=}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      MONGODB_URI: "${MONGODB_URI}"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      MONGODB_URI: "${MONGODB_URI}"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy

  vehicle-service:
    build:
      context: .
      dockerfile: vehicle-service/Dockerfile
    container_name: vehicle-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      MONGODB_URI: "${MONGODB_URI}"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    container_name: trip-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      MONGODB_URI: "${MONGODB_URI}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-your-google-maps-api-key}"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy

  ride-service:
    build:
      context: .
      dockerfile: ride-service/Dockerfile
    container_name: ride-service
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      MONGODB_URI: "${MONGODB_URI}"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      FIREBASE_CONFIG_PATH: "${FIREBASE_CONFIG_PATH}"
      FIREBASE_DATABASE_URL: "${FIREBASE_DATABASE_URL}"
    networks:
      - carsharing-network
    depends_on:
      eureka-server:
        condition: service_healthy
