# docker-compose.yml
# Tanzania Car Sharing Microservices

networks:
  tanzania-net:

services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
    networks:
      - tanzania-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8089:8089"
    environment:
      PORT: 8089
      ALLOWED_ORIGINS: "*"
      JWT_SECRET_KEY: "MjAxOTIwRVlRSTE5ODAxSktOMjgxOTgyNzM4OTFISks="
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    networks:
      - tanzania-net
    depends_on:
      - eureka-server

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      ALLOWED_ORIGINS: "*"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    networks:
      - tanzania-net
    depends_on:
      - eureka-server

  vehicle-service:
    build:
      context: .
      dockerfile: vehicle-service/Dockerfile
    container_name: vehicle-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      ALLOWED_ORIGINS: "*"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    networks:
      - tanzania-net
    depends_on:
      - eureka-server

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    container_name: trip-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      ALLOWED_ORIGINS: "*"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      GOOGLE_API_KEY: "your-google-maps-api-key"
    networks:
      - tanzania-net
    depends_on:
      - eureka-server

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: "*"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
    networks:
      - tanzania-net
    depends_on:
      - eureka-server
      - auth-service
      - user-service
      - vehicle-service
      - trip-service
