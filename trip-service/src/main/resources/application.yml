server:
  port: ${PORT:8083}

spring:
  application:
    name: trip-service
  cloud:
    loadbalancer:
      retry:
        enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

google:
  maps:
    api-key: ${GOOGLE_API_KEY:your-google-maps-api-key}

minDistanceInMetersBetween2PickupPoints: 500