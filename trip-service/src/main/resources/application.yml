server:
  forward-headers-strategy: framework
spring:
  application:
    name: trip-service
  main:
    cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
    loadbalancer:
      retry:
        enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://tempo.monitoring.svc.cluster.local:4318/v1/traces}

pagination:
  default-page-size: 20
  max-page-size: 100
  min-page-size: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  server:
    url: /trip-service

google:
  maps:
    api-key: ${GOOGLE_API_KEY:your-google-maps-api-key}

minDistanceInMetersBetween2PickupPoints: 500